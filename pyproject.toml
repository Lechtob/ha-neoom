[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-neoom-connect"
version = "0.1.0"
description = "Async Python client for neoom CONNECT cloud and local BEAAM APIs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Beam Integration Contributors" }
]
dependencies = [
  "aiohttp>=3.9.0",
]

[project.urls]
Documentation = "https://github.com/Lechtob/ha-neoom"
Issues = "https://github.com/Lechtob/ha-neoom/issues"
Source = "https://github.com/Lechtob/ha-neoom"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
build = [
  "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["packages/neoom-connect/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "packages/neoom-connect/src"]
addopts = "-p no:homeassistant"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
